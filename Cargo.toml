[workspace]
resolver = "2"
members = ["crates/*", "apps/cvmfs-status-page-rust"]
default-members = ["apps/cvmfs-status-page-rust"]
# CI builds historical checkouts independently with their original manifests.
exclude = [".html-reference", ".live-reference"]

[workspace.package]
version = "0.0.2"
edition = "2021"
authors = ["Terje Kvernes <terje@kvernes.no>"]
repository = "https://github.com/EESSI/cvmfs-status-page-rust"
publish = false

[workspace.dependencies]
cvmfs_server_scraper = "0.0.7"
futures = "0"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1"
env_logger = "*"
tera = { version = "2.4", features = ["glob_fs"] }
chrono = "0"
include_dir = "0"
clap = { version = "4", features = ["derive"] }
yare = "3"
rhai = "1"
log = "0.4"
tempfile = "3"
anyhow = "1"
strum = "0"
strum_macros = "0"
reqwest = { version = "0.13", features = ["json"] }
thiserror = "2"
actix-web = { version = "4", default-features = false, features = ["macros"] }
fs2 = "0.4"
percent-encoding = "2"
sha2 = "0.10"
status-domain = { path = "crates/status-domain" }
status-storage = { path = "crates/status-storage" }
status-application = { path = "crates/status-application" }
status-sources = { path = "crates/status-sources" }
status-storage-fs = { path = "crates/status-storage-fs" }
status-presentation = { path = "crates/status-presentation" }
status-http = { path = "crates/status-http" }
