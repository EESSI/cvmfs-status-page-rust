name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: cvmfs-status-page-rust

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      # Use the native musl compiler for C dependencies such as aws-lc-sys.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools cmake

      - name: Check installer
        run: |
          sh -n scripts/install.sh
          sh -n scripts/check-static-binary.sh
          shellcheck scripts/install.sh scripts/check-static-binary.sh
          python3 tests/test_install.py

      - name: Install Rust
        id: rust
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target "$RUST_TARGET"
          rustup default stable
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-

      - name: Validate tag matches Cargo version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cvmfs-status-page-rust") | .version')"
          if [ "$version" != "$cargo_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi

      - name: Extract release notes from changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]([[:space:]]|-|$)" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no notes for ${version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked --target "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Verify static binary
        run: |
          sh scripts/check-static-binary.sh "target/${{ matrix.target }}/release/${BINARY_NAME}"
          sh scripts/check-static-binary.sh "target/${{ matrix.target }}/release/cvmfs-status-server"

      - name: Package release artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          package="${BINARY_NAME}-${version}-${target}"
          mkdir -p "dist/${package}"
          cp "target/${target}/release/${BINARY_NAME}" "target/${target}/release/cvmfs-status-server" "dist/${package}/"
          cp README.md CHANGELOG.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          cd dist
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [build, publish-image-manifest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate tag matches Cargo version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cvmfs-status-page-rust") | .version')"
          if [ "$version" != "$cargo_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi

      - name: Extract release notes from changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]([[:space:]]|-|$)" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no notes for ${version}" >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/*.sha256 --title "$tag" --notes-file release-notes.md
          fi

  production-image:
    needs: build
    name: Production image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Check workspace build context
        run: python3 tests/test_build_context.py
      - name: Build production image
        run: docker build --target production -t cvmfs-status-server:test .
      - name: Smoke test production image and recovery
        run: python3 tests/test_container.py cvmfs-status-server:test
      - name: Publish tested architecture image
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}-${ARCH}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag cvmfs-status-server:test "$image"
          docker push "$image"

  publish-image-manifest:
    name: Publish amd64 and arm64 image manifest
    runs-on: ubuntu-24.04
    needs: production-image
    steps:
      - name: Publish manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker manifest create "$image" "${image}-amd64" "${image}-arm64"
          docker manifest push "$image"
