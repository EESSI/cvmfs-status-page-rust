name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: cvmfs-status-page-rust

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check installer
        run: |
          sh -n scripts/install.sh
          sh -n scripts/check-static-binary.sh
          shellcheck scripts/install.sh scripts/check-static-binary.sh
          python3 tests/test_install.py

      - name: Test live capture and replay tooling
        run: python3 tests/test_live_scrape_compare.py

      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust.outputs.version }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Verify generator and HTTP compatibility
        run: |
          cargo build --locked
          python3 tests/test_service.py
          python3 tests/test_build_context.py

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 '**/*.md' '#target' '#.html-reference' '#.live-reference'

      # Pin pre-migration main so this remains an independent reference after merging.
      - name: Checkout HTML reference
        uses: actions/checkout@v7
        with:
          ref: bc44664b95cd2a2a9d25fa9670b6cfdfbc3dd20a
          path: .html-reference
          persist-credentials: false

      - name: Build HTML reference
        working-directory: .html-reference
        run: cargo build --locked --target-dir ../target/html-reference

      - name: Compare HTML with pre-migration main
        run: |
          cargo build --locked
          python3 tests/test_html_output.py \
            --reference-root .html-reference \
            --reference-binary target/html-reference/debug/cvmfs-status-page-rust \
            --candidate-binary target/debug/cvmfs-status-page-rust

  pr-binary:
    name: Build PR binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      # Use the native musl compiler for C dependencies such as aws-lc-sys.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools cmake

      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.TARGET }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.TARGET }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.TARGET }}-${{ steps.rust.outputs.version }}-

      - name: Run musl tests
        run: cargo test --workspace --all-targets --all-features --locked --target "$TARGET"

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Verify static binary
        run: |
          sh scripts/check-static-binary.sh "target/${TARGET}/release/${BINARY_NAME}"
          sh scripts/check-static-binary.sh "target/${TARGET}/release/cvmfs-status-server"

      - name: Package PR artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short_sha="${PR_HEAD_SHA::12}"
          package="${BINARY_NAME}-pr-${PR_NUMBER}-${short_sha}-${TARGET}"
          mkdir -p "dist/${package}"
          cp "target/${TARGET}/release/${BINARY_NAME}" "target/${TARGET}/release/cvmfs-status-server" "dist/${package}/"
          cp README.md CHANGELOG.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          cd dist
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Upload PR binary
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.pull_request.number }}-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  production-image:
    name: Production image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Check workspace build context
        run: python3 tests/test_build_context.py
      - name: Build production image
        run: docker build --target production -t cvmfs-status-server:test .
      - name: Smoke test production image and recovery
        run: python3 tests/test_container.py cvmfs-status-server:test
