name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: cvmfs-status-page-rust
  TARGET: x86_64-unknown-linux-gnu

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installer
        run: |
          sh -n scripts/install.sh
          shellcheck scripts/install.sh
          python3 tests/test_install.py

      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.rust.outputs.version }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      # Pin pre-migration main so this remains an independent reference after merging.
      - name: Checkout HTML reference
        uses: actions/checkout@v4
        with:
          ref: bc44664b95cd2a2a9d25fa9670b6cfdfbc3dd20a
          path: .html-reference
          persist-credentials: false

      - name: Build HTML reference
        working-directory: .html-reference
        run: cargo build --locked --target-dir ../target/html-reference

      - name: Compare HTML with pre-migration main
        run: |
          cargo build --locked
          python3 tests/test_html_output.py \
            --reference-root .html-reference \
            --reference-binary target/html-reference/debug/cvmfs-status-page-rust \
            --candidate-binary target/debug/cvmfs-status-page-rust

  pr-binary:
    name: Build PR binary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.TARGET }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.TARGET }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.TARGET }}-${{ steps.rust.outputs.version }}-

      - name: Build release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Package PR artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short_sha="${PR_HEAD_SHA::12}"
          package="${BINARY_NAME}-pr-${PR_NUMBER}-${short_sha}-${TARGET}"
          mkdir -p "dist/${package}"
          cp "target/${TARGET}/release/${BINARY_NAME}" "dist/${package}/"
          cp README.md CHANGELOG.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          cd dist
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Upload PR binary
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
