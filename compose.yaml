services:
  status:
    build: .
    image: cvmfs-status-server:local
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 35s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    volumes:
      - status-state:/var/lib/cvmfs-status
      - ./config.json:/etc/cvmfs-status/config.json:ro
      - ./deploy/service.json:/etc/cvmfs-status/service.json:ro
      - ./deploy/overrides:/etc/cvmfs-status/overrides:ro
    command:
      - --configuration=/etc/cvmfs-status/config.json
      - --service-configuration=/etc/cvmfs-status/service.json
    environment:
      RUST_LOG: info
volumes:
  status-state:
